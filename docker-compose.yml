services:
  minio:
    build:
      context: .
      dockerfile: minio/Dockerfile
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${YCC_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${YCC_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-secrets-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - |
        if [ ! -s /run/airflow-secrets/jwt_secret ]; then
          umask 077
          head -c 64 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/airflow-secrets/jwt_secret
          chmod 0444 /run/airflow-secrets/jwt_secret
        fi
    volumes:
      - airflow_secrets:/run/airflow-secrets
    restart: "no"

  ycc-data-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - |
        mkdir -p /data/warehouse /data/work/downloads
        chown ${AIRFLOW_UID:-50000}:0 /data /data/warehouse /data/work /data/work/downloads
    volumes:
      - ycc_data:/data
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["bash", "-c", "airflow db migrate"]
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      YCC_YEAR: ${YCC_YEAR:-2024}
      YCC_DEMO_MONTHS: ${YCC_DEMO_MONTHS:-2024-01}
      YCC_S3_ENDPOINT: http://minio:9000
      YCC_S3_BUCKET: ${YCC_S3_BUCKET:-ycc-raw}
      YCC_S3_ACCESS_KEY: ${YCC_S3_ACCESS_KEY:-minioadmin}
      YCC_S3_SECRET_KEY: ${YCC_S3_SECRET_KEY:-minioadmin}
      YCC_S3_REGION: ${YCC_S3_REGION:-us-east-1}
      YCC_DUCKDB_PATH: ${YCC_DUCKDB_PATH:-/data/warehouse/ycc.duckdb}
      YCC_DUCKDB_MEMORY_LIMIT: ${YCC_DUCKDB_MEMORY_LIMIT:-6GB}
      YCC_DUCKDB_THREADS: ${YCC_DUCKDB_THREADS:-4}
      YCC_DBT_PROJECT_DIR: /opt/airflow/dbt
      YCC_WORK_DIR: /data/work
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_secrets:/run/airflow-secrets:ro
      - ycc_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      airflow-secrets-init:
        condition: service_completed_successfully
      ycc-data-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["api-server", "--host", "0.0.0.0", "--port", "8080"]
    environment: *airflow-environment
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_secrets:/run/airflow-secrets:ro
      - ycc_data:/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["scheduler"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_secrets:/run/airflow-secrets:ro
      - ycc_data:/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["dag-processor"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
      - airflow_secrets:/run/airflow-secrets:ro
      - ycc_data:/data
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "airflow",
          "jobs",
          "check",
          "--job-type",
          "DagProcessorJob",
          "--local",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
  airflow_secrets:
  ycc_data:
