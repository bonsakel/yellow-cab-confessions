yellow_cab_confessions:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('YCC_DUCKDB_PATH', '/data/warehouse/ycc.duckdb') }}"
      schema: analytics
      threads: "{{ env_var('YCC_DUCKDB_THREADS', '2') | int }}"
      settings:
        memory_limit: "{{ env_var('YCC_DUCKDB_MEMORY_LIMIT', '4GB') }}"
        threads: "{{ env_var('YCC_DUCKDB_THREADS', '2') | int }}"
      extensions:
        - parquet
