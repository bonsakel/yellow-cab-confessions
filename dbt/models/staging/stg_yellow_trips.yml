version: 2

models:
  - name: stg_yellow_trips
    description: >
      TLC yellow taxi trips standardized to typed, snake_case fields. Computes
      local-time trip metrics, deterministic trip IDs, duplicate ranks, and
      an array of all applicable quarantine reason codes.
    columns:
      - name: trip_id
        description: Stable hash of trip values and duplicate occurrence rank.
        data_tests:
          - unique
          - not_null
      - name: source_file
        description: Source TLC monthly parquet filename.
        data_tests:
          - not_null
      - name: vendor_id
        description: TLC vendor identifier.
      - name: pickup_datetime
        description: Pickup timestamp in naive local NYC time as published by TLC.
      - name: dropoff_datetime
        description: Drop-off timestamp in naive local NYC time as published by TLC.
      - name: passenger_count
        description: Reported passenger count.
      - name: trip_distance
        description: Reported trip distance in miles.
      - name: rate_code_id
        description: TLC rate-code identifier.
      - name: store_and_fwd_flag
        description: TLC store-and-forward indicator.
      - name: pickup_location_id
        description: TLC pickup-zone identifier.
      - name: dropoff_location_id
        description: TLC drop-off-zone identifier.
      - name: payment_type
        description: TLC payment-type code.
      - name: fare_amount
        description: Metered fare in US dollars.
      - name: extra
        description: Miscellaneous extra charges in US dollars.
      - name: mta_tax
        description: MTA tax in US dollars.
      - name: tip_amount
        description: Reported tip in US dollars; cash tips are not recorded.
      - name: tolls_amount
        description: Reported tolls in US dollars.
      - name: improvement_surcharge
        description: TLC improvement surcharge in US dollars.
      - name: total_amount
        description: Total charge in US dollars.
      - name: congestion_surcharge
        description: Congestion surcharge in US dollars.
      - name: airport_fee
        description: TLC airport fee in US dollars.
      - name: cbd_congestion_fee
        description: Central Business District congestion fee in US dollars.
      - name: source_month
        description: YYYY-MM extracted from the source filename.
      - name: source_month_start
        description: First local timestamp of the source file month.
      - name: trip_duration_seconds
        description: Elapsed pickup-to-dropoff duration in seconds.
      - name: trip_duration_min
        description: Elapsed trip duration in minutes.
      - name: avg_speed_mph
        description: Trip distance divided by elapsed hours; null for zero-duration trips.
      - name: pickup_local_hour
        description: Pickup timestamp truncated to the naive local NYC hour.
      - name: trip_date
        description: Local NYC pickup date.
      - name: trip_fingerprint
        description: Hash of normalized business fields used for duplicate detection.
      - name: duplicate_rank
        description: Occurrence number among trips with the same fingerprint.
      - name: is_unknown_zone
        description: True when either endpoint uses TLC's special unknown-zone IDs 264 or 265.
      - name: reject_reasons
        description: Array containing every quarantine rule code that the trip violates.
        data_tests:
          - not_null
  - name: stg_weather_hourly
    description: Open-Meteo weather measures keyed by naive local NYC hour.
    columns:
      - name: local_hour
        description: Unique naive NYC wall-clock hour, with fall-back duplicates aggregated upstream.
        data_tests:
          - unique
          - not_null
      - name: temperature_2m
        description: Mean air temperature in Celsius.
      - name: precipitation
        description: Hourly precipitation in millimeters.
      - name: rain
        description: Hourly rain in millimeters.
      - name: snowfall
        description: Hourly snowfall in centimeters.
      - name: wind_speed_10m
        description: Wind speed in kilometers per hour.
      - name: weather_code
        description: Open-Meteo weather interpretation code.
  - name: stg_holidays
    description: US and New York state holidays generated from the holidays library.
    columns:
      - name: holiday_date
        description: Calendar date of the holiday.
        data_tests:
          - unique
          - not_null
      - name: holiday_name
        description: Holiday display name.
        data_tests:
          - not_null
  - name: stg_taxi_zones
    description: >
      TLC zone lookup labels joined to WGS84 zone centroids, with a sentinel
      row for missing zone IDs.
    columns:
      - name: zone_id
        description: TLC zone identifier, including -1 for a missing ID.
        data_tests:
          - unique
          - not_null
      - name: borough
        description: TLC borough label.
      - name: zone_name
        description: TLC published zone name.
      - name: service_zone
        description: TLC published service zone label.
      - name: centroid_lat
        description: WGS84 zone centroid latitude, populated with zone shapes.
      - name: centroid_lon
        description: WGS84 zone centroid longitude, populated with zone shapes.
      - name: is_unknown_zone
        description: True for TLC IDs 264 and 265, plus the missing-zone sentinel.

unit_tests:
  - name: quarantine_rules_produce_expected_codes
    model: stg_yellow_trips
    given:
      - input: source("raw", "yellow_trips_raw")
        rows:
          - &baseline
            vendor_id: 1
            pickup_datetime: "2024-01-03 08:00:00"
            dropoff_datetime: "2024-01-03 08:15:00"
            passenger_count: 1
            trip_distance: 1.0
            rate_code_id: 1
            store_and_fwd_flag: N
            pickup_location_id: 1
            dropoff_location_id: 1
            payment_type: 1
            fare_amount: 10.0
            extra: 0.0
            mta_tax: 0.5
            tip_amount: 2.0
            tolls_amount: 0.0
            improvement_surcharge: 0.3
            total_amount: 12.8
            congestion_surcharge: 0.0
            airport_fee: 0.0
            cbd_congestion_fee: 0.0
            source_file: yellow_tripdata_2024-01.parquet
          - <<: *baseline
            fare_amount: -1.0
            total_amount: -1.0
          - <<: *baseline
            vendor_id: 2
            pickup_datetime: "2024-01-03 09:00:00"
            dropoff_datetime: "2024-01-03 08:59:00"
            trip_distance: 0.1
          - <<: *baseline
            vendor_id: 3
            pickup_datetime: "2024-01-03 10:00:00"
            dropoff_datetime: "2024-01-03 10:00:29"
            trip_distance: 0.51
          - <<: *baseline
            vendor_id: 4
            pickup_datetime: "2024-01-03 11:00:00"
            dropoff_datetime: "2024-01-03 18:00:00"
          - <<: *baseline
            vendor_id: 5
            pickup_datetime: "2024-01-03 12:00:00"
            dropoff_datetime: "2024-01-03 12:15:00"
            trip_distance: 0.0
            fare_amount: 11.0
            total_amount: 14.0
          - <<: *baseline
            vendor_id: 6
            pickup_datetime: "2024-01-03 13:00:00"
            dropoff_datetime: "2024-01-03 15:00:00"
            trip_distance: 101.0
          - <<: *baseline
            vendor_id: 7
            pickup_datetime: "2024-01-03 14:00:00"
            dropoff_datetime: "2024-01-03 15:00:00"
            trip_distance: 81.0
          - <<: *baseline
            vendor_id: 8
            pickup_datetime: "2024-02-01 08:00:00"
            dropoff_datetime: "2024-02-01 08:15:00"
          - <<: *baseline
            vendor_id: 9
            pickup_datetime: "2024-01-03 15:00:00"
            dropoff_datetime: "2024-01-03 15:15:00"
            passenger_count: 9
          - <<: *baseline
            vendor_id: 10
            pickup_datetime: "2024-01-03 16:00:00"
            dropoff_datetime: "2024-01-03 16:15:00"
            pickup_location_id: 999
          - <<: *baseline
      - input: source("raw", "taxi_zone_lookup")
        rows:
          - {location_id: 1}
    expect:
      rows:
        - {reject_reasons: []}
        - {reject_reasons: ["NEGATIVE_FARE"]}
        - {reject_reasons: ["DROPOFF_BEFORE_PICKUP"]}
        - {reject_reasons: ["ZERO_DURATION"]}
        - {reject_reasons: ["ABSURD_DURATION"]}
        - {reject_reasons: ["ZERO_DISTANCE_PAID"]}
        - {reject_reasons: ["ABSURD_DISTANCE"]}
        - {reject_reasons: ["TELEPORTING_CAB"]}
        - {reject_reasons: ["OUT_OF_RANGE_DATE"]}
        - {reject_reasons: ["BAD_PASSENGER_COUNT"]}
        - {reject_reasons: ["UNKNOWN_ZONE"]}
        - {reject_reasons: ["DUPLICATE_TRIP"]}
