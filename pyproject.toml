[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yellow-cab-confessions"
version = "0.1.0"
description = "An end-to-end NYC yellow taxi analytics pipeline and app."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.35,<2",
    "duckdb==2.0.0",
    "pydantic-settings>=2.8,<3",
    "tenacity>=9,<10",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["ycc*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
